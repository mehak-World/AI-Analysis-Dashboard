services:

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes


  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile

    container_name: python-service
    restart: unless-stopped

    env_file:
      - ./python-service/.env

    expose:
      - "8000"

    ports:
      - "8000:8000"

  node:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: node
    restart: unless-stopped

    env_file:
      - ./server/.env

    ports:
      - "3000:3000"

    depends_on:
      - redis
      - python-service


volumes:
  redis_data: